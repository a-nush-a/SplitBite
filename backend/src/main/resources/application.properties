# Server Port
server.port=8080

# Application Name
spring.application.name=SplitBite

# MySQL Database Configuration
# Default connection to local MySQL (adjust password if yours is different, e.g. root/root or root/admin)
spring.datasource.url=jdbc:mysql://localhost:3306/splitbite_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─────────────────────────────────────────────────────────────────────────────
# Google Gemini Vision AI — Receipt Scanning
# ─────────────────────────────────────────────────────────────────────────────
# The API key is READ FROM THE ENVIRONMENT VARIABLE "GEMINI_API_KEY".
# Never hardcode the real key here if you push this file to GitHub!
#
# Local development:  set GEMINI_API_KEY=AIzaSy... in your system environment,
#                     OR uncomment the line below and paste your key (do NOT commit it):
# gemini.api.key=AIzaSy_PASTE_YOUR_KEY_HERE
#
# Deployment (Railway / Render / any server):
#   Add environment variable  GEMINI_API_KEY = AIzaSy...  in the hosting dashboard.
#   The app reads it automatically — no code change needed.
#
gemini.api.key=${GEMINI_API_KEY:}
